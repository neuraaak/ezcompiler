name: 01 · CI

# Quality gate: quality/type-check run first and block the test matrix; security
# runs in parallel and deliberately gates nothing (it reads an external advisory
# feed, so it can turn red without the code changing). Runs on PRs, and as the
# release gate via workflow_call from 02-tag-sync (no bare `push` trigger → one
# CI run per change, no double runs).
#
# No `paths:` filter: `poe lint` and `poe format-check` cover the whole tree, so
# a filtered trigger would hide a break under .scripts/, examples/ or docs/.

on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Four consumers (quality, type-check, security, test): all four install,
  # so the primer is above the ~3-consumer heuristic on its own merits.
  install-deps:
    name: Install & cache deps
    uses: ./.github/workflows/00-install-deps.yml

  quality:
    name: Lint & format
    needs: [install-deps]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: uv run --frozen poe lint
      - run: uv run --frozen poe format-check

  type-check:
    name: Type check & contracts
    needs: [install-deps]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen --all-extras --group dev
      - run: uv run --frozen poe typecheck
      # The poe task carries PYTHONPATH=src itself (import-linter 2.x needs
      # the package importable).
      - run: uv run --frozen poe imports

  security:
    name: Security scan
    needs: [install-deps]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen --all-extras --group dev
      # `poe security` chains the two gates documented in AGENTS.md:
      #
      #   1. bandit — SAST of the package's own code.
      #   2. pip-audit — CVEs in the locked dependencies: this package signs
      #      TUF releases, so a CVE in tufup/cryptography/boto3 hits the
      #      chain itself.
      #
      # The task pins `--ignore-vuln GHSA-qp9x-wp8f-qgjj` (python-tuf 4.0.0,
      # fixed in 7.0.0): tufup 0.10.0 pins `tuf==4.0.*`, so the upgrade is not
      # ours to make. The impact is limited to the updater client on Windows
      # and assumes a repository whose delegations differ only by case — which
      # this project does not generate (a single `targets` role).
      # Exit condition: drop that ignore as soon as tufup relaxes its bound
      # on tuf.
      - run: uv run --frozen poe security

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: [quality, type-check]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Windows is the product's target OS (AGENTS.md): path, argv-quoting
        # and file-locking regressions only show up there. Ubuntu stays the
        # reference matrix for coverage.
        os: [ubuntu-24.04, windows-latest]
        python: ["3.13"]
    env:
      # Without the extras, the TUF/R2 tests would be skipped silently:
      # the guard in tests/conftest.py turns the omission into a failure.
      EZCOMPILER_REQUIRE_EXTRAS: "1"
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --frozen --all-extras --group dev
      # `poe test-ci` carries the coverage threshold, which is deliberately
      # not in addopts: a partial local run must not exit with code 1.
      - run: uv run --frozen poe test-ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.13' && always()
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          retention-days: 7
