name: 01 · CI

# Quality gate: lint/format and type-check/import-contracts run first and block
# the test matrix. Runs on PRs, and as the release gate via workflow_call from
# 02-tag-sync (no bare `push` trigger → one CI run per change, no double runs).

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/00-install-deps.yml"
      - ".github/workflows/01-ci.yml"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  install-deps:
    uses: ./.github/workflows/00-install-deps.yml

  lint:
    name: Lint & Format Check
    needs: [install-deps]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .

  type-check:
    name: Type Check & Import Contracts
    needs: [install-deps]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen --all-extras --group dev
      - run: uv run --frozen ty check src/ezcompiler/
      - run: PYTHONPATH=src uv run --frozen lint-imports

  security:
    name: Security (bandit + pip-audit)
    needs: [install-deps]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen --all-extras --group dev
      # SAST of the package's own code: the gate documented in AGENTS.md.
      - run: uv run --frozen bandit -r src/ezcompiler -ll
      # CVEs in the locked dependencies: this package signs TUF releases,
      # so a CVE in tufup/cryptography/boto3 hits the chain itself.
      #
      # GHSA-qp9x-wp8f-qgjj (python-tuf 4.0.0, fixed in 7.0.0) is ignored:
      # tufup 0.10.0 pins `tuf==4.0.*`, so the upgrade is not ours to make.
      # The impact is limited to the updater client on Windows and assumes a
      # repository whose delegations differ only by case — which this project
      # does not generate (a single `targets` role).
      # Exit condition: drop this ignore as soon as tufup relaxes its bound
      # on tuf.
      - run: uv run --frozen pip-audit --ignore-vuln GHSA-qp9x-wp8f-qgjj

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: [lint, type-check]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Windows is the product's target OS (AGENTS.md): path, argv-quoting
        # and file-locking regressions only show up there. Ubuntu stays the
        # reference matrix for coverage.
        os: [ubuntu-24.04, windows-latest]
        python: ["3.13"]
    env:
      # Without the extras, the TUF/R2 tests would be skipped silently:
      # the guard in tests/conftest.py turns the omission into a failure.
      EZCOMPILER_REQUIRE_EXTRAS: "1"
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --frozen --all-extras --group dev
      # The coverage threshold lives here, not in addopts: a partial local
      # run must not exit with code 1.
      - run: uv run --frozen pytest --cov=src/ezcompiler --cov-fail-under=70
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.13' && always()
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          retention-days: 7
